services:
  - type: web
    name: dukanbook
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # --- Secrets: set these in the Render dashboard, never commit them ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # Second Ollama model, tried before any cloud provider. Leave empty when
      # no Ollama is reachable; set it alongside OLLAMA_URL below so a
      # quota-limited primary (e.g. a hosted :cloud model) hands off to a model
      # on the same machine rather than jumping straight to Gemini.
      - key: OLLAMA_FALLBACK_MODEL
        sync: false

      # --- Optional: drive the deployed app from a self-hosted Ollama ---
      # Leave both empty and the app uses Gemini/Groq as normal. Set them to
      # point at an Ollama exposed over a tunnel and it becomes the first
      # provider, with the cloud still behind it if the tunnel is unreachable.
      #   OLLAMA_URL   https://<your-tunnel>/v1/chat/completions
      #   OLLAMA_MODEL qwen3:8b
      # Requires the tunnel to stay up; anything unreachable falls through.
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      # Long enough for a cold model to load from disk over the tunnel (~60s
      # measured), short enough that a dead tunnel fails over to the cloud
      # rather than hanging the reply. Warm calls return in a few seconds.
      - key: OLLAMA_TIMEOUT
        value: "90"

      # A fresh container starts with an empty ledger; load the demo shop so the
      # live link has something to show.
      - key: SEED_ON_START
        value: "1"

    # --- Persistence ---
    # The free plan has no persistent disk: the SQLite file lives in the
    # container and is wiped whenever the service restarts or redeploys (free
    # services also sleep after ~15 min idle). SEED_ON_START above means it
    # always comes back with the demo shop rather than empty.
    #
    # To keep real data, move to a paid instance and uncomment both blocks:
    #
    # plan: starter
    # disk:
    #   name: dukanbook-data
    #   mountPath: /data
    #   sizeGB: 1
    # and add:
    #   - key: DUKANBOOK_DB
    #     value: /data/dukanbook.db
